<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>BioDataQC · Delivery readiness</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:216px;overflow:hidden;background:transparent}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.hero{height:208px;position:relative;overflow:hidden;border:1px solid #284858;border-radius:19px;
 background:radial-gradient(ellipse at 83% 52%,#123f4b 0%,#0e293a 37%,#0b1d2e 78%);color:#edf7fb}
.grid{position:absolute;inset:0;opacity:.16;background-image:radial-gradient(#4b8992 .75px,transparent .75px);background-size:20px 20px;
 mask-image:linear-gradient(to right,transparent 40%,#000)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0b1d2e 0%,#0b1d2ef0 30%,#0b1d2e99 49%,transparent 72%)}
.copy{position:relative;z-index:2;padding:25px 30px;width:68%}
.eyebrow{display:flex;align-items:center;gap:9px;color:#8bd6d4;font-size:10px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;margin-bottom:13px}
.mark{width:6px;height:6px;border-radius:2px;background:#6ee2cd;box-shadow:0 0 10px #6ee2cd55}
h1{margin:0;color:#f3fafc;font-size:clamp(27px,3.4vw,43px);line-height:1.13;font-weight:650;letter-spacing:-1.5px}
h1 span{color:#8ee4d9}
p{margin:12px 0 18px;color:#b6ccd9;font-size:13px;line-height:1.5;max-width:440px}
.tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{border:1px solid #365363;border-radius:5px;padding:5px 8px;font-size:9px;letter-spacing:.85px;color:#d0e2e9;background:#12304399}
.annotation{position:absolute;right:19px;bottom:13px;color:#91b3bf;font-size:9px;letter-spacing:1.5px;z-index:2}
@media(max-width:700px){.copy{padding:27px 23px;width:78%}h1{font-size:34px;max-width:340px}.eyebrow{font-size:9px;letter-spacing:1.6px}.tag{font-size:8px}.annotation{right:12px;font-size:8px}}
@media(max-width:420px){.copy{width:94%;padding:18px 16px}.eyebrow{font-size:8px;letter-spacing:1px;margin-bottom:9px}h1{font-size:29px;max-width:220px;letter-spacing:-1px}p{font-size:12px;max-width:225px;margin:9px 0 12px}.tags{gap:5px}.tag{padding:4px 6px;font-size:8px}.veil{background:linear-gradient(90deg,#0b1d2efa 0%,#0b1d2ed9 48%,#0b1d2e55 100%)}.annotation{display:none}}
</style>
</head>
<body>
<header class="hero">
 <div class="grid" aria-hidden="true"></div>
 <canvas id="helix" aria-hidden="true"></canvas>
 <div class="veil" aria-hidden="true"></div>
 <div class="copy">
  <div class="eyebrow"><i class="mark" aria-hidden="true"></i>BioDataQC / Quality workspace</div>
  <h1>Delivery <span>readiness.</span></h1>
  <p>Sequencing data, with a clear trail of evidence.</p>
  <div class="tags" aria-label="Application capabilities">
   <span class="tag">VALIDATE</span><span class="tag">REVIEW</span><span class="tag">PREPARE DELIVERY</span>
  </div>
 </div>
</header>
<script>
(() => {
  'use strict';
  // Decorative 3D coordinates, projected onto a local 2D canvas. No network assets.
  const enabled = __ANIMATE_DNA__;
  const canvas = document.getElementById('helix');
  const ctx = canvas.getContext('2d');
  if (!ctx) return; // The readable header remains available without Canvas.
  const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
  let width = 900, height = 208, phase = 0.63;
  let request = 0, lastTime = 0, lastPaint = 0, visible = true;
  const palettes = [[76,214,196],[117,177,231]];
  const color = (rgb,a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;

  function project(x,y,z) {
    const rotation = -.43;
    const xx = x*Math.cos(rotation)-y*Math.sin(rotation);
    const yy = x*Math.sin(rotation)+y*Math.cos(rotation);
    const perspective = 680/(680+z);
    const scale = height/405;
    return {x:width*(width < 420 ? 0.87 : 0.81)+xx*scale*perspective,
            y:height*.50+yy*scale*perspective,z,scale:scale*perspective};
  }
  function node(u,strand) {
    const theta = u*Math.PI*4.1+phase+strand*Math.PI;
    return project(Math.cos(theta)*91,(u-.5)*350,Math.sin(theta)*91);
  }
  function draw() {
    ctx.clearRect(0,0,width,height);
    const shapes=[];
    // Smooth backbone tubes.
    for(let strand=0;strand<2;strand++) {
      for(let i=0;i<112;i++) {
        const a=node(i/112,strand),b=node((i+1)/112,strand);
        shapes.push({type:'line',a,b,z:(a.z+b.z)/2,rgb:palettes[strand],weight:7});
      }
    }
    // Base-pair rungs are subdivided so front/back crossings sort correctly.
    for(let i=0;i<=24;i++) {
      const u=i/24,theta=u*Math.PI*4.1+phase;
      const ax=Math.cos(theta)*91,az=Math.sin(theta)*91,y=(u-.5)*350;
      for(let part=0;part<10;part++) {
        const q=1-2*part/10,r=1-2*(part+1)/10;
        const a=project(ax*q,y,az*q),b=project(ax*r,y,az*r);
        shapes.push({type:'line',a,b,z:(a.z+b.z)/2,rgb:palettes[part<5?0:1],weight:3.3});
      }
      for(let strand=0;strand<2;strand++) {
        const p=node(u,strand);
        shapes.push({type:'sphere',p,z:p.z,rgb:palettes[strand]});
      }
    }
    shapes.sort((a,b)=>b.z-a.z);
    ctx.lineCap='round';ctx.lineJoin='round';
    for(const shape of shapes) {
      const depth=Math.max(.18,Math.min(1,(130-shape.z)/230));
      if(shape.type==='line') {
        ctx.beginPath();ctx.moveTo(shape.a.x,shape.a.y);ctx.lineTo(shape.b.x,shape.b.y);
        ctx.strokeStyle=color(shape.rgb,.18+.65*depth);
        ctx.lineWidth=shape.weight*(shape.a.scale+shape.b.scale)/2;ctx.stroke();
        if(shape.weight>5 && depth>.5) {
          ctx.strokeStyle=`rgba(216,255,250,${depth*.24})`;
          ctx.lineWidth=1.1*shape.a.scale;ctx.stroke();
        }
      } else {
        const p=shape.p,r=6.2*p.scale;
        const gradient=ctx.createRadialGradient(p.x-r*.4,p.y-r*.45,r*.03,p.x,p.y,r);
        gradient.addColorStop(0,`rgba(229,255,252,${.32+.64*depth})`);
        gradient.addColorStop(.32,color(shape.rgb,.35+.6*depth));
        gradient.addColorStop(1,color(shape.rgb,.13+.42*depth));
        ctx.fillStyle=gradient;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
      }
    }
  }
  function resize() {
    const rect=canvas.getBoundingClientRect();width=rect.width;height=rect.height;
    const ratio=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
    ctx.setTransform(ratio,0,0,ratio,0,0);draw();
  }
  function shouldAnimate() {return enabled && !motionPreference.matches && visible && !document.hidden;}
  function tick(time) {
    request=0;
    if(!shouldAnimate()) {lastTime=0;return;}
    if(lastTime) phase+=(Math.min(time-lastTime,80))*Math.PI*2/18000;
    lastTime=time;
    if(time-lastPaint>=1000/30) {draw();lastPaint=time;}
    request=window.requestAnimationFrame(tick);
  }
  function sync() {
    if(request) window.cancelAnimationFrame(request);
    request=0;lastTime=0;
    if(shouldAnimate()) request=window.requestAnimationFrame(tick);
    else draw();
  }
  new ResizeObserver(resize).observe(canvas);
  if('IntersectionObserver' in window) {
    new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;sync();}).observe(canvas);
  }
  motionPreference.addEventListener('change',sync);
  document.addEventListener('visibilitychange',sync);
  window.addEventListener('pagehide',()=>{if(request)window.cancelAnimationFrame(request);});
  resize();sync();
})();
</script>
</body>
</html>
